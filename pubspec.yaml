name: doctor_consultation_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_svg: ^2.2.4
  google_fonts: ^8.0.2
  get: ^4.6.5
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  image_picker: ^1.0.0
  flutter_animate: ^4.5.2
  file_picker: ^11.0.2
  font_awesome_flutter: ^11.0.0
  provider: ^6.1.2
  supabase_flutter: ^2.12.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-lldb-debugging: false

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
